name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Убедитесь, что ваша основная ветка называется main

# Разрешения для деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отмена предыдущих запусков при новом пуше
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Vite 6 требует Node.js 18+, ставим 20 для надежности
          cache: 'npm'
      
      - name: Install dependencies & Clean Cache
        run: |
          # Полная очистка для решения ошибки Invalid module
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force
          npm install
      
      - name: Build project
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
