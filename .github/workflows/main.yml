name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Убедитесь, что ваша ветка называется main или master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Важно! Ставим свежую версию для Vite 6
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci # Используем ci для точной установки из lock-файла
      
      - name: Build
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
           - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force
          npm install
      
      - name: Build
        run: npm run build
